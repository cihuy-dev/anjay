<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I3Pack DEV MODE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<style>
body{font-family:Arial;background:#0a0f1a;color:#e6edf3;padding:20px}
button{margin:5px;padding:10px}
#preview canvas{max-width:300px;margin-top:10px;border:1px solid #333}
</style>
</head>
<body><h2>?? DEV MODE I3Pack Tool (Repack + Injector + Decoder)</h2>
<input type="file" id="fileInput" accept=".i3pack" />
<input type="file" id="injectInput" multiple />
<button id="dumpAll" disabled>Dump</button>
<button onclick="repackFull()">Repack + Inject</button>
<div id="preview"></div>
<pre id="log"></pre><script>
let rawBytes;
let filesMap=[];
let injectFiles=[];

function log(msg){document.getElementById('log').textContent+=msg+"\n"}

function safeSlice(s,e){
 if(s<0)s=0;
 if(e>rawBytes.length)e=rawBytes.length;
 return rawBytes.subarray(s,e);
}

function detect(offset){
 let b=rawBytes;
 if(b[offset]===0x49 && b[offset+1]===0x9A) return {ext:"i3s",name:"I3S"};
 if(b[offset]===0x44 && b[offset+1]===0x44 && b[offset+2]===0x53) return {ext:"dds",name:"DDS"};
 if(b[offset]===0x4F && b[offset+1]===0x67) return {ext:"ogg",name:"OGG"};
 if(b[offset]===0x52 && b[offset+1]===0x49) return {ext:"wav",name:"WAV"};
 if(b[offset]===0x78 && b[offset+1]===0x9C) return {ext:"zlib",name:"Compressed"};
 return null;
}

function tryDecompress(data){
 try{return pako.inflate(data);}catch{return data;}
}

function repairI3S(data){
 if(data[0]!==0x49 || data[1]!==0x9A){
  let fix=new Uint8Array(data.length);
  fix.set(data);
  fix[0]=0x49;fix[1]=0x9A;
  return fix;
 }
 return data;
}

function rebuildAlign(data){
 let pad=16-(data.length%16);
 if(pad===16)return data;
 let out=new Uint8Array(data.length+pad);
 out.set(data);
 return out;
}

function scan(){
 filesMap=[];
 let id=0;

 for(let i=0;i<rawBytes.length-4;i++){
  let t=detect(i);
  if(t){
   let next=i+1;
   while(next<rawBytes.length-4 && !detect(next)) next++;

   let data=safeSlice(i,next);
   if(data.length<32) continue;

   filesMap.push({id:id++,offset:i,size:data.length,type:t});
   log(`${t.name} @${i}`);
   i=next-1;
  }
 }

 log("TOTAL: "+filesMap.length);
 document.getElementById('dumpAll').disabled=false;
}

// inject file loader

document.getElementById('injectInput').addEventListener('change',e=>{
 injectFiles=[...e.target.files];
 log("Inject file loaded: "+injectFiles.length);
});

// FULL REPACK + INJECTOR
async function repackFull(){
 const zip=new JSZip();

 filesMap.forEach((f,i)=>{
  let data=safeSlice(f.offset,f.offset+f.size);

  data=tryDecompress(data);
  if(f.type.ext==="i3s") data=repairI3S(data);
  data=rebuildAlign(data);

  zip.file(`original/${f.type.name}_${f.id}.${f.type.ext}`,data);
 });

 // inject tambahan
 injectFiles.forEach(file=>{
  zip.file(`inject/${file.name}`,file);
 });

 const blob=await zip.generateAsync({type:"blob"});
 let a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download="DEV_REPACK.zip";
 a.click();

 log("Repack + Inject selesai");
}


document.getElementById('fileInput').addEventListener('change',e=>{
 let file=e.target.files[0];
 let r=new FileReader();
 r.onload=ev=>{
  rawBytes=new Uint8Array(ev.target.result);
  log("DEV MODE scanning...");
  scan();
 };
 r.readAsArrayBuffer(file);
});


document.getElementById('dumpAll').onclick=async()=>{
 const zip=new JSZip();

 filesMap.forEach(f=>{
  let data=safeSlice(f.offset,f.offset+f.size);
  data=tryDecompress(data);
  if(f.type.ext==="i3s") data=repairI3S(data);
  data=rebuildAlign(data);

  zip.file(`${f.type.name}/file_${f.id}.${f.type.ext}`,data);
 });

 const blob=await zip.generateAsync({type:"blob"});
 let a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download="DEV_dump.zip";
 a.click();
};
</script></body>
</html>
