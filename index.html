<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>i3pack tool + OBJ Preview</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/OBJLoader.js"></script>
<style>
body{margin:0;font-family:sans-serif;background:#111;color:#eee}
.container{display:flex;height:100vh}
.sidebar{width:300px;background:#1a1a1a;overflow:auto;padding:10px}
.viewer{flex:1;position:relative}
canvas{display:block}
button{margin:5px;padding:5px}
</style>
</head>
<body>
<div class="container">
<div class="sidebar">
<input type="file" id="fileInput" accept=".i3pack"><br>
<button id="btnDump">Dump + Convert OBJ</button>
<ul id="list"></ul>
</div>
<div class="viewer" id="viewer"></div>
</div><script>
let rawBytes=null, filesMap=[];

function applyI3SFix(name,type){
 if(type===0) return name+".i3s";
 return name;
}

// SIMPLE FAKE CONVERTER (placeholder)
function convertToOBJ(data){
 // NOTE: real i3s parsing complex ? ini dummy mesh
 return `o dummy\nv 0 0 0\nv 1 0 0\nv 0 1 0\nf 1 2 3`;
}

// THREE VIEWER
let scene=new THREE.Scene();
let camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
let renderer=new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth,window.innerHeight);
document.getElementById("viewer").appendChild(renderer.domElement);

let controls=new THREE.OrbitControls(camera,renderer.domElement);
camera.position.z=5;

function animate(){requestAnimationFrame(animate);renderer.render(scene,camera);}animate();

function loadOBJ(text){
 while(scene.children.length>0) scene.remove(scene.children[0]);
 let loader=new THREE.OBJLoader();
 let obj=loader.parse(text);
 scene.add(obj);
}

// FILE INPUT

document.getElementById("fileInput").addEventListener("change",e=>{
 let file=e.target.files[0];
 let reader=new FileReader();
 reader.onload=ev=>{
 rawBytes=new Uint8Array(ev.target.result);
 filesMap=[{id:0,offset:0,size:rawBytes.length,type:0,finalName:"model.i3s"}];
 renderList();
 };
 reader.readAsArrayBuffer(file);
});

function renderList(){
 let list=document.getElementById("list");
 list.innerHTML="";
 filesMap.forEach(f=>{
 let li=document.createElement("li");
 li.innerHTML=`${f.finalName} <button onclick="preview(${f.id})">Preview</button>`;
 list.appendChild(li);
 });
}

window.preview=function(id){
 let f=filesMap.find(x=>x.id===id);
 let data=rawBytes.subarray(f.offset,f.offset+f.size);
 let objText=convertToOBJ(data);
 loadOBJ(objText);
}

// DUMP + CONVERT

document.getElementById("btnDump").onclick=async()=>{
 let zip=new JSZip();
 filesMap.forEach(f=>{
 let data=rawBytes.subarray(f.offset,f.offset+f.size);
 let obj=convertToOBJ(data);
 let name=applyI3SFix(f.finalName,f.type);
 zip.file(name+".obj",obj);
 });
 let blob=await zip.generateAsync({type:"blob"});
 let a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="converted_obj.zip";
 a.click();
};
</script></body>
</html>
