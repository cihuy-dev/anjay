<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>I3Pack Universal Tool</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
body { font-family: Arial; background:#f5f5f5; padding:20px;}
.panel { background:white; padding:15px; border-radius:8px; margin-bottom:15px;}
button { padding:8px 12px; cursor:pointer;}
</style>
</head>
<body>

<div class="panel">
<input type="file" id="fileInput">
<button id="dumpBtn">Dump All</button>
</div>

<div class="panel">
<div id="log"></div>
</div>

<script>
let rawBytes, filesMap=[], nodesMap=[], breakpoints=[];
let noNodeMode=false;

function log(t){
    document.getElementById("log").innerHTML += t+"<br>";
}

function getString(buff,i,len){
    return new TextDecoder().decode(buff.slice(i,i+len));
}

function isRange(i,len,max){ return (i+len)<max; }

// ===== AUTO DETECT I3S =====
function isI3S(buff,i){
    if(!isRange(i,4,buff.length)) return false;
    return (
        (buff[i]===0x49 && buff[i+1]===0x9A && buff[i+2]===0x91 && buff[i+3]===0x90) ||
        getString(buff,i,4)==="I3R2"
    );
}

// ===== AUTO DETECT I3I =====
function isI3I(buff,i){
    if(!isRange(i,8,buff.length)) return false;
    if(getString(buff,i,4)!=="I3IB") return false;

    // optional filter ringan
    return buff[i+4] !== 0x00;
}

document.getElementById("fileInput").addEventListener("change",e=>{
    let f=e.target.files[0];
    let r=new FileReader();

    r.onload=ev=>{
        rawBytes=new Uint8Array(ev.target.result);
        scan(rawBytes);
    };
    r.readAsArrayBuffer(f);
});

function scan(buff){

    filesMap=[];
    nodesMap=[];
    breakpoints=[];
    noNodeMode=false;

    let lastTrnNode=0, contentId=0;

    // ===== DETECT MODE =====
    if(getString(buff,0,4)==="I3R2"){
        noNodeMode=true;
        nodesMap=["Root"];
        lastTrnNode=1;
        log("Mode RAW i3pack terdeteksi");
    }

    for(let i=0;i<buff.length;i++){

        // ===== NODE MODE =====
        if(!noNodeMode && buff[i]===105 && getString(buff,i,10)==="i3PackNode"){
            log("Node detected");
        }

        // ===== I3S =====
        else if(isI3S(buff,i)){
            filesMap.push({
                id:contentId++,
                node:noNodeMode?0:(lastTrnNode-1),
                offset:i,
                type:"i3s"
            });
            breakpoints.push(i);
            i+=3;
        }

        // ===== I3I =====
        else if(isI3I(buff,i)){
            filesMap.push({
                id:contentId++,
                node:noNodeMode?0:(lastTrnNode-1),
                offset:i,
                type:"i3i"
            });
            breakpoints.push(i);
            i+=7;
        }

        // ===== DDS =====
        else if(getString(buff,i,3)==="DDS"){
            filesMap.push({
                id:contentId++,
                node:0,
                offset:i,
                type:"dds"
            });
            breakpoints.push(i);
            i+=100;
        }

        // ===== WAV =====
        else if(getString(buff,i,4)==="RIFF"){
            filesMap.push({id:contentId++,node:0,offset:i,type:"wav"});
            breakpoints.push(i);
        }

        // ===== OGG =====
        else if(getString(buff,i,4)==="OggS"){
            filesMap.push({id:contentId++,node:0,offset:i,type:"ogg"});
            breakpoints.push(i);
        }

        // ===== FALLBACK I3I =====
        else if(getString(buff,i,3)==="I3I"){
            filesMap.push({
                id:contentId++,
                node:0,
                offset:i,
                type:"i3i"
            });
            breakpoints.push(i);
        }
    }

    // ===== SIZE FIX =====
    breakpoints.sort((a,b)=>a-b);

    for(let j=0;j<filesMap.length;j++){
        let cur=filesMap[j].offset;
        let next=breakpoints.find(b=>b>cur);
        filesMap[j].size=next?next-cur:buff.length-cur;
    }

    log("Total file: "+filesMap.length);
}

// ===== DUMP ZIP =====
document.getElementById("dumpBtn").onclick=async()=>{
    const zip=new JSZip();

    filesMap.forEach(f=>{
        let data=rawBytes.slice(f.offset,f.offset+f.size);
        zip.file(f.type+"_"+f.id+"."+f.type,data);
    });

    let blob=await zip.generateAsync({type:"blob"});
    let a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="dump.zip";
    a.click();
};
</script>

</body>
</html>
