<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web i3Pack Tool - Fixed Version</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

<input type="file" id="fileInput">
<button id="btnDumpAll" disabled>Dump</button>

<script>
let rawBytes = null;
let nodesMap = [];
let filesMap = [];
let breakpoints = [];
let fileNameOriginal = "";

const typeMap = {
    0: { ext: "i3s", name: "I3S Data" },
    1: { ext: "txt", name: "Text Document" },
    2: { ext: "i3i", name: "I3I Image" },
    3: { ext: "config.txt", name: "Map Config" },
    4: { ext: "wav", name: "WAV Audio" },
    5: { ext: "ogg", name: "OGG Audio" },
    6: { ext: "dds", name: "DDS Texture" }
};

function getString(buff, index, count) {
    if (index + count > buff.length) return "";
    return new TextDecoder("ascii").decode(buff.subarray(index, index + count));
}

/* =========================
   ? FIX I3S (TAMBAHAN)
========================= */
function fixI3S(data) {
    const isI3S =
        (data[0] === 0x49 && data[1] === 0x9A && data[2] === 0x91 && data[3] === 0x90) ||
        (data[0] === 0x49 && data[1] === 0x33 && data[2] === 0x52 && data[3] === 0x32);

    if (!isI3S) return data;

    let end = data.length;
    while (end > 0 && data[end - 1] === 0x00) {
        end--;
    }

    let cleaned = data.subarray(0, end);

    // kalau masih error, aktifkan:
    // cleaned = cleaned.subarray(16);

    return cleaned;
}
/* ========================= */

document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    fileNameOriginal = file.name.replace('.i3pack', '');
    nodesMap = [];
    filesMap = [];
    breakpoints = [];

    const reader = new FileReader();
    reader.onload = function(evt) {
        rawBytes = new Uint8Array(evt.target.result);
        scanI3Pack(rawBytes);
    };
    reader.readAsArrayBuffer(file);
});

function scanI3Pack(buff) {
    let lastTrnNode = 0;
    let contentId = 0;

    for (let i = 0; i < buff.length; i++) {

        if (buff[i] === 84 && getString(buff, i, 4) === "TRN3") {
            breakpoints.push(i);
            lastTrnNode++;
            i += 3;
        }

        else if (buff[i] === 0x49 && buff[i+1] === 0x9A && buff[i+2] === 0x91 && buff[i+3] === 0x90) {
            filesMap.push({ id: contentId++, node: 0, offset: i, type: 0 });
            breakpoints.push(i);
            i += 3;
        }
    }

    breakpoints.sort((a, b) => a - b);

    for (let j = 0; j < filesMap.length; j++) {
        let currentOffset = filesMap[j].offset;
        let bpIndex = breakpoints.indexOf(currentOffset);
        let nextOffset = breakpoints[bpIndex + 1];

        if (nextOffset) {
            filesMap[j].size = nextOffset - currentOffset;
        } else {
            filesMap[j].size = rawBytes.length - currentOffset;
        }
    }

    document.getElementById('btnDumpAll').disabled = false;
}

/* =========================
   ? DOWNLOAD SINGLE (DITAMBAH FIX)
========================= */
function downloadSingleFile(fileId) {
    const file = filesMap.find(f => f.id === fileId);
    if (!file) return;

    let fileData = rawBytes.subarray(file.offset, file.offset + file.size);

    if (file.type === 0) {
        fileData = fixI3S(fileData);
    }

    const blob = new Blob([fileData]);
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "file_" + file.id + ".i3s";
    link.click();
}
/* ========================= */

/* =========================
   ? DUMP ALL (DITAMBAH FIX)
========================= */
document.getElementById('btnDumpAll').addEventListener('click', async function() {
    const zip = new JSZip();

    filesMap.forEach(file => {
        let fileData = rawBytes.subarray(file.offset, file.offset + file.size);

        if (file.type === 0) {
            fileData = fixI3S(fileData);
        }

        zip.file("file_" + file.id + ".i3s", fileData);
    });

    const blob = await zip.generateAsync({ type: "blob" });

    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = fileNameOriginal + "_dump.zip";
    link.click();
});
/* ========================= */

</script>
</body>
</html>
